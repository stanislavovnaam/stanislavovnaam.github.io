<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: #306986;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .progress-bar {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            margin: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
        }
        
        .content {
            padding: 30px;
        }
        
        .question-card {
            background: #f8f9fa;
            border-left: 5px solid #306986;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        
        .question-card h2 {
            color: #306986;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .question-text {
            font-size: 1.2em;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .code-block {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            overflow-x: auto;
            white-space: pre;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .option {
            background: white;
            border: 2px solid #ddd;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }
        
        .option:hover {
            border-color: #306986;
            background: #f0f4f8;
            transform: translateX(5px);
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .feedback.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        
        .feedback.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #306986;
            color: white;
        }
        
        .btn-primary:hover {
            background: #265a73;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        .hidden {
            display: none;
        }
        
        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }
        
        .result-screen h2 {
            color: #306986;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: #ffc107;
            color: #333;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐍 Python Тренажёр</h1>
            <p>Интерактивные задания для начинающих</p>
        </header>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress">0%</div>
        </div>
        
        <div class="content">
            <div id="quiz-container">
                <!-- Вопросы будут здесь -->
            </div>
            
            <div id="result-screen" class="result-screen hidden">
                <h2>🎉 Поздравляем!</h2>
                <p>Вы завершили все задания!</p>
                <div class="stats" id="final-stats">
                    <!-- Статистика -->
                </div>
                <button class="btn-primary" onclick="restartQuiz()" style="margin-top: 30px;">
                    Начать заново
                </button>
            </div>
            
            <div class="controls" id="controls">
                <button class="btn-secondary" onclick="prevQuestion()" id="prev-btn">← Назад</button>
                <button class="btn-primary" onclick="nextQuestion()" id="next-btn" disabled>Далее →</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "Переменные и типы данных",
                question: "Что выведет этот код?",
                code: `x = 5\ny = "3"\nprint(x + int(y))`,
                options: ["8", "53", "Ошибка", "35"],
                correct: 0,
                explanation: "int(y) преобразует строку '3' в число 3, поэтому 5 + 3 = 8"
            },
            {
                id: 2,
                title: "Списки",
                question: "Как получить последний элемент списка?",
                code: `fruits = ["яблоко", "банан", "апельсин"]`,
                options: ["fruits[0]", "fruits[-1]", "fruits[last]", "fruits[3]"],
                correct: 1,
                explanation: "Отрицательный индекс -1 в Python означает последний элемент списка"
            },
            {
                id: 3,
                title: "Условные операторы",
                question: "Что выведет этот код?",
                code: `age = 15\nif age >= 18:\n    print("Взрослый")\nelse:\n    print("Ребёнок")`,
                options: ["Взрослый", "Ребёнок", "Ошибка", "Ничего"],
                correct: 1,
                explanation: "15 меньше 18, поэтому выполнится ветка else и выведется 'Ребёнок'"
            },
            {
                id: 4,
                title: "Циклы",
                question: "Сколько раз выполнится цикл?",
                code: `for i in range(3, 7):\n    print(i)`,
                options: ["3 раза", "4 раза", "5 раз", "7 раз"],
                correct: 1,
                explanation: "range(3, 7) генерирует числа 3, 4, 5, 6 — всего 4 числа"
            },
            {
                id: 5,
                title: "Функции",
                question: "Что вернёт эта функция?",
                code: `def greet(name):\n    return "Привет, " + name\n\nprint(greet("Анна"))`,
                options: ["Привет", "Анна", "Привет, Анна", "Ошибка"],
                correct: 2,
                explanation: "Функция возвращает строку 'Привет, ' + имя, то есть 'Привет, Анна'"
            },
            {
                id: 6,
                title: "Словари",
                question: "Как получить значение по ключу 'age'?",
                code: `person = {"name": "Иван", "age": 25, "city": "Москва"}`,
                options: ["person[0]", "person.get('age')", "person.age", "person['age']"],
                correct: 3,
                explanation: "person['age'] — стандартный способ получения значения по ключу в словаре"
            },
            {
                id: 7,
                title: "Строки",
                question: "Что выведет этот код?",
                code: `text = "Python"\nprint(text[1:4])`,
                options: ["Pyt", "yth", "ytho", "thon"],
                correct: 1,
                explanation: "Срез [1:4] берёт символы с индексами 1, 2, 3 — это 'yth'"
            },
            {
                id: 8,
                title: "Методы строк",
                question: "Что сделает метод .upper()?",
                code: `name = "алекс"\nprint(name.upper())`,
                options: ["aleks", "АЛЕКС", "Алекс", "ошибка"],
                correct: 1,
                explanation: ".upper() преобразует все буквы строки в верхний регистр"
            },
            {
                id: 9,
                title: "Цикл while",
                question: "Что выведет этот код?",
                code: `i = 0\nwhile i < 3:\n    print(i, end=' ')\n    i += 1`,
                options: ["0 1 2", "1 2 3", "0 1 2 3", "1 2"],
                correct: 0,
                explanation: "Цикл выведет 0, 1, 2 (пока i < 3), затем i станет 3 и цикл остановится"
            },
            {
                id: 10,
                title: "Списки и методы",
                question: "Что добавит элемент в конец списка?",
                code: `nums = [1, 2, 3]`,
                options: ["nums.add(4)", "nums.append(4)", "nums.insert(4)", "nums.push(4)"],
                correct: 1,
                explanation: ".append() добавляет элемент в конец списка в Python"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let answeredQuestions = new Set();

        function renderQuestion(index) {
            const q = questions[index];
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = `
                <div class="question-card">
                    <h2>Задание ${index + 1}: ${q.title}</h2>
                    <p class="question-text">${q.question}</p>
                    ${q.code ? `<div class="code-block">${q.code}</div>` : ''}
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="selectOption(${i})" id="option-${i}">
                                ${opt}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback ${userAnswers[index] === q.correct ? 'success' : 'error'}" 
                         id="feedback" style="display: ${userAnswers[index] !== null ? 'block' : 'none'}">
                        <strong>${userAnswers[index] === q.correct ? '✓ Правильно!' : '✗ Неправильно'}</strong>
                        <p>${q.explanation}</p>
                    </div>
                </div>
            `;
            
            // Подсветка выбранного ответа
            if (userAnswers[index] !== null) {
                const selectedOption = document.getElementById(`option-${userAnswers[index]}`);
                if (userAnswers[index] === q.correct) {
                    selectedOption.classList.add('correct');
                } else {
                    selectedOption.classList.add('wrong');
                    document.getElementById(`option-${q.correct}`).classList.add('correct');
                }
            }
            
            updateControls();
            updateProgress();
        }

        function selectOption(optionIndex) {
            if (userAnswers[currentQuestion] !== null) return; // Уже ответили
            
            const q = questions[currentQuestion];
            userAnswers[currentQuestion] = optionIndex;
            answeredQuestions.add(currentQuestion);
            
            if (optionIndex === q.correct) {
                score++;
            }
            
            renderQuestion(currentQuestion);
        }

        function updateControls() {
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').disabled = userAnswers[currentQuestion] === null;
        }

        function updateProgress() {
            const percent = Math.round((answeredQuestions.size / questions.length) * 100);
            document.getElementById('progress').style.width = percent + '%';
            document.getElementById('progress').textContent = percent + '%';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion(currentQuestion);
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion(currentQuestion);
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            let badge = '';
            if (percentage >= 90) badge = '🏆 Эксперт Python';
            else if (percentage >= 70) badge = '🥈 Продвинутый';
            else if (percentage >= 50) badge = '🥉 Начинающий';
            else badge = '📚 Продолжайте учиться!';
            
            document.getElementById('final-stats').innerHTML = `
                <div class="stat-card">
                    <h3>${score}/${questions.length}</h3>
                    <p>Правильных ответов</p>
                </div>
                <div class="stat-card">
                    <h3>${percentage}%</h3>
                    <p>Успешность</p>
                </div>
                <div class="stat-card">
                    <h3>${badge}</h3>
                    <p>Ваш уровень</p>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            answeredQuestions = new Set();
            
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            
            renderQuestion(0);
        }

        // Инициализация
        renderQuestion(0);
    </script>
</body>
</html>

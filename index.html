<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Окна</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #fff4d6;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <h1>Учебный пример</h1>
  <p>Нажми кнопку, чтобы открыть несколько окон.</p>
  <button onclick="openWindows()">Открыть окна</button>

  <script>
    function openWindows() {
      let count = 0;
      const maxCount = 5;

      const timer = setInterval(() => {
        window.open(
          '',
          '_blank',
          'width=300,height=150'
        ).document.write('<h3>Привет!</h3><p>Это новое окно.</p>');

        count++;
        if (count >= maxCount) {
          clearInterval(timer);
        }
      }, 500);
    }
  </script>
</body>
</html>
